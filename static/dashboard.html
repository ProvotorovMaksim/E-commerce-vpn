<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetShield Dashboard</title>
    <!-- Подключаем библиотеку для генерации QR-кода на клиенте -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #3b82f6; --danger: #ef4444; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid #334155; }
        input, button, select, textarea { width: 100%; padding: 0.75rem; margin-top: 0.5rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { background: var(--accent); border: none; cursor: pointer; font-weight: 600; margin-top: 1rem; }
        button:hover { opacity: 0.9; }
        button.danger { background: var(--danger); }
        .hidden { display: none !important; }
        .device-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #334155; }
        .device-item:last-child { border-bottom: none; }
        .status { font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
        .status.pending { background: #f59e0b; color: #000; }
        .status.active { background: #10b981; color: #000; }

        /* Стили для модального окна */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 2rem; border-radius: 8px; width: 90%; max-width: 400px; position: relative; border: 1px solid #334155; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: #94a3b8; }
        .close-btn:hover { color: white; }
        .config-box { width: 100%; height: 150px; background: #020617; color: #10b981; border: 1px solid #334155; border-radius: 6px; padding: 0.5rem; font-family: monospace; font-size: 0.8rem; resize: none; margin-top: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <!-- Форма входа -->
    <div id="login-section" class="card">
        <h2>Вход в систему</h2>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button onclick="login()">Войти</button>
        <p id="login-error" style="color: var(--danger); margin-top: 0.5rem;"></p>
    </div>

    <!-- Панель управления -->
    <div id="dashboard-section" class="hidden">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="user-email" style="margin: 0;"></h3>
            <button onclick="logout()" style="width: auto; margin: 0; background: #475569;">Выйти</button>
        </div>

        <div class="card">
            <h3>Добавить устройство</h3>
            <input type="text" id="device-name" placeholder="Название (например, iPhone 15)">
            <select id="country-code">
                <option value="DE">Германия (DE)</option>
                <option value="US">США (US)</option>
                <option value="NL">Нидерланды (NL)</option>
            </select>
            <button onclick="createDevice()">Сгенерировать конфиг</button>
        </div>

        <div class="card">
            <h3>Мои устройства</h3>
            <div id="devices-list">Загрузка...</div>
        </div>
    </div>
</div>

<!-- Модальное окно для отображения QR и конфига -->
<div id="config-modal" class="modal hidden">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 style="margin-top: 0;">Настройки подключения</h3>
        <div id="qrcode" style="display: flex; justify-content: center; margin: 1rem 0; background: white; padding: 10px; border-radius: 8px; width: fit-content; margin-left: auto; margin-right: auto;"></div>
        <p style="text-align: center; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem;">Отсканируйте код в приложении WireGuard или скопируйте текст:</p>
        <textarea id="config-text" class="config-box" readonly></textarea>
        <button onclick="copyConfig()">Копировать конфиг</button>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8000/api'; 
    let token = localStorage.getItem('vpn_token');

    if (token) showDashboard();

    async function apiCall(endpoint, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const response = await fetch(`${API_BASE}${endpoint}`, {
            method, headers, body: body ? JSON.stringify(body) : null
        });

        if (response.status === 401) {
            logout();
            throw new Error('Сессия истекла');
        }
        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail || 'Ошибка сервера');
        }
        return response.json();
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
            const data = await apiCall('/login', 'POST', { email, password });
            token = data.access_token;
            localStorage.setItem('vpn_token', token);
            showDashboard();
        } catch (e) {
            document.getElementById('login-error').innerText = e.message;
        }
    }

    function logout() {
        token = null;
        localStorage.removeItem('vpn_token');
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
    }

    async function showDashboard() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        await loadDevices();
    }

    async function loadDevices() {
        const listEl = document.getElementById('devices-list');
        listEl.innerHTML = 'Загрузка...';
        try {
            const data = await apiCall('/vpn/devices');
            const devices = data.devices_list || [];
            
            if (devices.length === 0) {
                listEl.innerHTML = '<p style="color: #94a3b8;">Устройств пока нет.</p>';
                return;
            }

            listEl.innerHTML = devices.map(dev => `
                <div class="device-item">
                    <div>
                        <strong>${dev.name}</strong> 
                        <span class="status ${dev.status}">${dev.status}</span>
                        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">${dev.country_code}</div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button style="width: auto; margin: 0;" onclick="showConfig(${dev.id})">Конфиг</button>
                        <button class="danger" style="width: auto; margin: 0;" onclick="deleteDevice(${dev.id})">Удалить</button>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            listEl.innerHTML = `<p style="color: var(--danger);">Ошибка: ${e.message}</p>`;
        }
    }

    async function createDevice() {
        const name = document.getElementById('device-name').value;
        const country_code = document.getElementById('country-code').value;
        if (!name) return alert('Введите название устройства');

        try {
            await apiCall('/vpn/device', 'POST', { name, country_code });
            document.getElementById('device-name').value = '';
            await loadDevices();
        } catch (e) {
            alert(e.message);
        }
    }

    async function showConfig(deviceId) {
        try {
            const data = await apiCall(`/vpn/device/${deviceId}`);
            const modal = document.getElementById('config-modal');
            const qrContainer = document.getElementById('qrcode');
            const configTextEl = document.getElementById('config-text');
            
            // Очищаем предыдущий QR-код
            qrContainer.innerHTML = '';
            
            // Генерируем новый QR-код на клиенте
            new QRCode(qrContainer, {
                text: data.config_text,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            
            configTextEl.value = data.config_text;
            modal.classList.remove('hidden');
        } catch (e) {
            alert(e.message);
        }
    }

    function closeModal() {
        document.getElementById('config-modal').classList.add('hidden');
    }

    function copyConfig() {
        const configTextEl = document.getElementById('config-text');
        configTextEl.select();
        navigator.clipboard.writeText(configTextEl.value).then(() => {
            alert('Конфиг скопирован в буфер обмена!');
        }).catch(() => {
            alert('Не удалось скопировать. Выделите текст вручную.');
        });
    }

    async function deleteDevice(deviceId) {
        if (!confirm('Вы уверены, что хотите удалить это устройство? Доступ будет немедленно отозван.')) return;
        try {
            await apiCall(`/vpn/devices/${deviceId}`, 'DELETE');
            await loadDevices();
        } catch (e) {
            alert(e.message);
        }
    }
</script>
</body>
</html>
